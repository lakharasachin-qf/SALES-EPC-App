name: sales_app
description: "Sales App"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  sizer: ^3.0.5
  get: ^4.7.2
  flutter_svg: ^2.2.0
  connectivity_plus: ^6.1.4
  http: ^1.4.0
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  cached_network_image: ^3.4.1
  pull_to_refresh_flutter3: ^2.0.2
  permission_handler: ^12.0.0+1
  loading_animation_widget: ^1.3.0
  animate_do: ^4.2.0
  smooth_page_indicator: ^1.2.1
  syncfusion_flutter_datepicker: ^30.1.39
  intl: ^0.20.2
  syncfusion_flutter_charts: ^30.1.40
  path_provider: ^2.1.5
  dropdown_button2: ^2.3.9
  flutter_datetime_picker_plus: ^2.2.0
  file_picker: ^10.3.3
  photo_view: ^0.15.0
  syncfusion_flutter_pdfviewer: ^30.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

# The following section is specific to Flutter packages.
flutter:

  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/pngs/
    - assets/svgs/
    - assets/gif/

  fonts:
    - family: PlusJakartaSans-Bold
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-Bold.ttf
    - family: PlusJakartaSans-BoldItalic
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-BoldItalic.ttf
    - family: PlusJakartaSans-ExtraBold
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-ExtraBold.ttf
    - family: PlusJakartaSans-ExtraBoldItalic
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-ExtraBoldItalic.ttf
    - family: PlusJakartaSans-ExtraLight
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-ExtraLight.ttf
    - family: PlusJakartaSans-ExtraLightItalic
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-ExtraLightItalic.ttf
    - family: PlusJakartaSans-Italic
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-Italic.ttf
    - family: PlusJakartaSans-Light
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-Light.ttf
    - family: PlusJakartaSans-LightItalic
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-LightItalic.ttf
    - family: PlusJakartaSans-Medium
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-Medium.ttf
    - family: PlusJakartaSans-MediumItalic
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-MediumItalic.ttf
    - family: PlusJakartaSans-Regular
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-Regular.ttf
    - family: PlusJakartaSans-SemiBold
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-SemiBold.ttf
    - family: PlusJakartaSans-SemiBoldItalic
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-SemiBoldItalic.ttf
